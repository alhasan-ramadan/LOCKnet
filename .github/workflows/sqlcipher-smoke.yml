name: SQLCipher Smoke

env:
  USE_OFFICIAL_SQLCIPHER: "false"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/LOCKnet.Data/**"
      - "tests/LOCKnet.Data.Tests/**"
      - ".github/workflows/sqlcipher-smoke.yml"
  push:
    branches: ["main", "dev"]
    paths:
      - "src/LOCKnet.Data/**"
      - "tests/LOCKnet.Data.Tests/**"
      - ".github/workflows/sqlcipher-smoke.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Runtime Smoke (${{ matrix.os }} / ${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            run_smoke: true
          - os: ubuntu-latest
            rid: linux-x64
            run_smoke: true
          - os: macos-latest
            rid: osx-x64
            run_smoke: true
          - os: macos-latest
            rid: osx-arm64
            run_smoke: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore /p:UseOfficialSqlCipher=${{ env.USE_OFFICIAL_SQLCIPHER }}

      - name: Publish CLI smoke artifact (${{ matrix.rid }})
        run: >-
          dotnet publish src/LOCKnet.CLI/LOCKnet.CLI.csproj
          -c Release
          -r ${{ matrix.rid }}
          /p:UseOfficialSqlCipher=${{ env.USE_OFFICIAL_SQLCIPHER }}
          --self-contained false
          -o publish/sqlcipher-smoke/${{ matrix.rid }}

      - name: Run SQLCipher runtime smoke tests
        if: matrix.run_smoke
        run: >-
          dotnet test tests/LOCKnet.Data.Tests/LOCKnet.Data.Tests.csproj
          -c Release
          /p:UseOfficialSqlCipher=${{ env.USE_OFFICIAL_SQLCIPHER }}
          --filter "FullyQualifiedName~SqlCipherEncryptedVaultMigrationExporterTests"

      - name: Official SQLCipher path dry-run (expected to fail without licensed native packages)
        if: matrix.run_smoke
        continue-on-error: true
        run: >-
          dotnet test tests/LOCKnet.Data.Tests/LOCKnet.Data.Tests.csproj
          -c Release
          /p:UseOfficialSqlCipher=true
          --filter "FullyQualifiedName~SqlCipherEncryptedVaultMigrationExporterTests.ProbeRuntime_LoadsSqlCipherProvider"

      - name: Generate official SQLCipher NuGet config
        if: matrix.run_smoke && env.USE_OFFICIAL_SQLCIPHER == 'true'
        shell: bash
        run: |
          cat > NuGet.official-sqlcipher.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="zetetic-official" value="${SQLCIPHER_NUGET_SOURCE_URL}" />
            </packageSources>
            <packageSourceCredentials>
              <zetetic-official>
                <add key="Username" value="${SQLCIPHER_NUGET_USERNAME}" />
                <add key="ClearTextPassword" value="${SQLCIPHER_NUGET_PASSWORD}" />
              </zetetic-official>
            </packageSourceCredentials>
          </configuration>
          EOF
        env:
          SQLCIPHER_NUGET_SOURCE_URL: ${{ secrets.SQLCIPHER_NUGET_SOURCE_URL }}
          SQLCIPHER_NUGET_USERNAME: ${{ secrets.SQLCIPHER_NUGET_USERNAME }}
          SQLCIPHER_NUGET_PASSWORD: ${{ secrets.SQLCIPHER_NUGET_PASSWORD }}

      - name: Official SQLCipher restore
        if: matrix.run_smoke && env.USE_OFFICIAL_SQLCIPHER == 'true'
        run: >-
          dotnet restore LOCKnet.sln
          --configfile NuGet.official-sqlcipher.config
          /p:UseOfficialSqlCipher=true
          /p:OfficialSqlCipherRuntimePackage=${{ env.OFFICIAL_SQLCIPHER_RUNTIME_PACKAGE }}
          /p:OfficialSqlCipherRuntimeVersion=${{ env.OFFICIAL_SQLCIPHER_RUNTIME_VERSION }}

      - name: Official SQLCipher runtime smoke tests
        if: matrix.run_smoke && env.USE_OFFICIAL_SQLCIPHER == 'true'
        run: >-
          dotnet test tests/LOCKnet.Data.Tests/LOCKnet.Data.Tests.csproj
          -c Release
          --no-restore
          /p:UseOfficialSqlCipher=true
          /p:OfficialSqlCipherRuntimePackage=${{ env.OFFICIAL_SQLCIPHER_RUNTIME_PACKAGE }}
          /p:OfficialSqlCipherRuntimeVersion=${{ env.OFFICIAL_SQLCIPHER_RUNTIME_VERSION }}
          --filter "FullyQualifiedName~SqlCipherEncryptedVaultMigrationExporterTests"

      - name: Clean official SQLCipher NuGet config
        if: always() && env.USE_OFFICIAL_SQLCIPHER == 'true'
        shell: bash
        run: rm -f NuGet.official-sqlcipher.config

      - name: Upload published smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-smoke-${{ matrix.os }}-${{ matrix.rid }}
          path: publish/sqlcipher-smoke/${{ matrix.rid }}/
