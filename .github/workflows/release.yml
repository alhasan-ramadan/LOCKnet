name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ─────────────────────────────────────────────
  # Build self-contained single-file binaries
  # for all four target platforms, then publish
  # them as a GitHub Release.
  # ─────────────────────────────────────────────
  release:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - rid: win-x64
            asset_name: LOCKnet-win-x64.exe
            binary: LOCKnet.App.exe
          - rid: linux-x64
            asset_name: LOCKnet-linux-x64
            binary: LOCKnet.App
          - rid: osx-x64
            asset_name: LOCKnet-osx-x64
            binary: LOCKnet.App
          - rid: osx-arm64
            asset_name: LOCKnet-osx-arm64
            binary: LOCKnet.App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish – ${{ matrix.rid }}
        run: |
          dotnet publish src/LOCKnet.App/LOCKnet.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:EnableCompressionInSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Rename binary to asset name
        run: |
          mv "publish/${{ matrix.rid }}/${{ matrix.binary }}" \
             "publish/${{ matrix.rid }}/${{ matrix.asset_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LOCKnet ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: publish/${{ matrix.rid }}/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
