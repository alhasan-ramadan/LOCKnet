name: Pages

# Deploy coverage report + Doxygen API docs to GitHub Pages.
# Runs only on pushes to main so PRs never overwrite live docs.
on:
  push:
    branches: ["main"]
  # Allow manual re-deploy (e.g. after Doxyfile changes)
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages needs push access to gh-pages branch

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. COVERAGE  ─  run tests, generate HTML report + badges
  # ───────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run tests with coverage
        run: |
          dotnet test \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results

      - name: Generate coverage report + badges
        run: |
          dotnet tool run reportgenerator \
            "-reports:test-results/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:HtmlInline;Badges;Cobertura;TextSummary"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ───────────────────────────────────────────────────────────────
  # 2. DOXYGEN  ─  generate API docs
  #    Caches the apt package to avoid downloading doxygen on every run.
  # ───────────────────────────────────────────────────────────────
  doxygen:
    name: Doxygen Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache the apt package list + doxygen binary.
      # Key includes the doxygen package version so cache invalidates on upgrades.
      - name: Cache Doxygen apt package
        id: cache-doxygen
        uses: actions/cache@v4
        with:
          path: /usr/bin/doxygen
          key: doxygen-${{ runner.os }}-${{ hashFiles('/var/lib/dpkg/info/doxygen.list') }}-v1

      - name: Install Doxygen (if not cached)
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate Doxygen HTML
        run: doxygen Doxyfile

      - name: Upload doxygen artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-report
          path: doxygen-output/html/

  # ───────────────────────────────────────────────────────────────
  # 3. DEPLOY  ─  publish both to gh-pages branch
  # ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [coverage, doxygen]

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: public/coverage

      - name: Download doxygen artifact
        uses: actions/download-artifact@v4
        with:
          name: doxygen-report
          path: public/doxygen

      # Minimal index so users who hit the Pages root see useful links
      - name: Create root index.html
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>LOCKnet – Project Pages</title>
          <style>body{font-family:sans-serif;max-width:480px;margin:4rem auto;color:#222}
          a{color:#6c63ff}h1{margin-bottom:.5rem}</style></head>
          <body>
          <h1>LOCKnet</h1>
          <p><a href="coverage/">📊 Coverage Report</a></p>
          <p><a href="doxygen/">📖 API Documentation</a></p>
          </body></html>
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # Keep files from previous deploys not produced this run
          keep_files: false
          commit_message: "docs: deploy coverage + doxygen [skip ci]"
